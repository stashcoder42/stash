"File watcher status"
type WatcherStatus {
  "Whether the watcher is currently running"
  running: Boolean!
  "Root paths being watched"
  watchedPaths: [String!]!
  "Total number of directories being watched (including subdirectories)"
  watchCount: Int!
  "Number of file events pending processing"
  pendingEvents: Int!
  "Total number of file events processed since service start"
  processedEvents: Int!
  "Number of scans triggered since service start"
  triggeredScans: Int!
  "Number of cleans triggered since service start"
  triggeredCleans: Int!
  "Last error message, if any"
  lastError: String
}

"Configuration for the file watcher"
input ConfigWatcherInput {
  "Enable or disable the file watcher"
  enabled: Boolean
  "Debounce delay in milliseconds before triggering scan"
  debounceMs: Int
  "Trigger scan when files change"
  scanOnChange: Boolean
  "Trigger identify after scan when files change"
  identifyOnChange: Boolean
  "Trigger clean when files are removed (detects moves via fingerprint matching)"
  cleanOnRemove: Boolean
}

"File watcher configuration result"
type ConfigWatcherResult {
  "Whether the file watcher is enabled"
  enabled: Boolean!
  "Debounce delay in milliseconds"
  debounceMs: Int!
  "Whether to trigger scan on file change"
  scanOnChange: Boolean!
  "Whether to trigger identify after scan"
  identifyOnChange: Boolean!
  "Whether to trigger clean on file removal"
  cleanOnRemove: Boolean!
}
