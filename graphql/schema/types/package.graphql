enum PackageType {
  Scraper
  Plugin
}

"Indicates which content types a scraper package supports"
type ScraperTypes {
  scene: Boolean!
  gallery: Boolean!
  image: Boolean!
  performer: Boolean!
  group: Boolean!
  audio: Boolean!
}

type Package {
  package_id: String!
  name: String!
  version: String
  date: Timestamp
  requires: [Package!]!

  sourceURL: String!

  "The version of this package currently available from the remote source"
  source_package: Package

  metadata: Map!

  "Content types supported by this scraper package. Only applicable for scraper packages."
  scraper_types: ScraperTypes
}

input PackageSpecInput {
  id: String!
  sourceURL: String!
}

type PackageSource {
  name: String
  url: String!
  local_path: String
}

input PackageSourceInput {
  name: String
  url: String!
  local_path: String
}
